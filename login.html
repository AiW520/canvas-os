<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canvas OS · 登录</title><link rel="stylesheet" href="./login.css"></head><body><main class="auth-shell"><div class="auth-brand"><span class="brand-orbit"></span><span>C</span></div><p class="eyebrow">CANVAS OS / WORKSPACE</p><h1>进入你的工作空间</h1><p class="auth-subtitle">本机账号用于保护画布、素材和 HTML PPT。</p><section class="auth-card"><div class="auth-tabs"><button id="loginTab" class="active">登录</button><button id="registerTab">注册</button></div><form id="authForm"><label>用户名<input id="username" name="username" autocomplete="username" required minlength="3" maxlength="40" pattern="[A-Za-z0-9_.-]{3,40}"></label><label id="nameField" hidden>显示名称<input id="name" name="name" autocomplete="name" maxlength="40"></label><label>密码<input id="password" name="password" type="password" autocomplete="current-password" required minlength="10" maxlength="128"><small id="passwordHint">至少 10 个字符</small></label><label id="confirmField" hidden>确认密码<input id="confirm" type="password" autocomplete="new-password"></label><button id="submitAuth" class="primary" type="submit">登录</button><p id="authMessage" role="alert"></p></form></section><p id="setupHint" class="setup-hint" hidden>这是第一次使用，注册的第一个账号会自动成为管理员。</p><footer>本机服务 · 密码只在服务端验证，不保存到浏览器 localStorage</footer></main><script src="./login.js"></script></body></html>
